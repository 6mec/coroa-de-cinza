function polish(raw,outline=true){const w=raw.width,h=raw.height,src=raw.getContext('2d').getImageData(0,0,w,h).data,c=mkCanvas(w+2,h+2),g=c.getContext('2d'),out=g.createImageData(w+2,h+2),o=out.data;
  const A=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&src[(y*w+x)*4+3]>0;
  for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){const i=((y+1)*(w+2)+(x+1))*4;
    if(A(x,y)){const s=(y*w+x)*4;let f=1;if(!A(x,y-1))f=1.25;else if(!A(x,y+1))f=.72;else if(!A(x-1,y))f=1.1;else if(!A(x+1,y))f=.86;
      o[i]=Math.min(255,src[s]*f);o[i+1]=Math.min(255,src[s+1]*f);o[i+2]=Math.min(255,src[s+2]*f);o[i+3]=255}
    else if(outline&&(A(x-1,y)||A(x+1,y)||A(x,y-1)||A(x,y+1))){o[i]=16;o[i+1]=11;o[i+2]=9;o[i+3]=235}}
  g.putImageData(out,0,0);return c}
function tint(c,col,a){const t=mkCanvas(c.width,c.height),g=t.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-atop';g.globalAlpha=a;g.fillStyle=col;g.fillRect(0,0,c.width,c.height);return t}

    if(mx!==mn){const dd=mx-mn;s=l>.5?dd/(2-mx-mn):dd/(mx+mn);h=mx===r?(gg-b)/dd+(gg<b?6:0):mx===gg?(b-r)/dd+2:(r-gg)/dd+4;h/=6}

function waterSpot(){let best=null,bd=1e9;const tx=tt(P.x),ty=tt(P.y);for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const x=tx+dx,y=ty+dy;if(at(x,y)!==WATER&&!(G.zone===5&&at(x,y)===ICE))continue;const cx=x*T+16,cy=y*T+16,d=Math.hypot(cx-P.x,cy-P.y);if(d>58)continue;const ang=Math.abs(angDiff(Math.atan2(cy-P.y,cx-P.x),P.face)),sc=Math.abs(d-48)+ang*30;if(sc<bd){bd=sc;best={x:cx,y:cy}}}return best}

function updFish(dt){const F=G.fish;if(!F)return;if(P.st!=='fish'){G.fish=null;return}const inp=input();if(inp.m>.6&&F.st!=='reel'){endFish('Recolheste a linha.');return}F.t+=dt;
  if(F.st==='cast'){if(F.t>.45){F.st='wait';F.t=0;splash(F.bx,F.by,4)}}
  else if(F.st==='wait'){if(F.t>F.wait){F.st='bite';F.t=0;F.k=rollFish();sfx('chime');buzz(30);splash(F.bx,F.by,10)}}
  else if(F.st==='bite'){if(G.buf.attack>0){G.buf.attack=0;const f=FISH[F.k];F.st='reel';F.t=0;F.p=.3;F.fy=.5;F.fv=0;F.ft=.5;F.zy=.5;F.zv=0;F.zs=.30-Math.min(.08,f.df*.04);sfx('swing')}

  else if(F.st==='reel'){const f=FISH[F.k],hold=held.attack||G.fhold||keys.Space||keys.KeyJ;
    F.zv+=(hold?-2.6:2.2)*dt;F.zv*=Math.pow(.25,dt);F.zy=clamp(F.zy+F.zv*dt,F.zs/2,1-F.zs/2);if(F.zy<=F.zs/2||F.zy>=1-F.zs/2)F.zv*=.3;
    F.ft-=dt;if(F.ft<=0){F.ft=.4+Math.random()*(1.2-f.df*.35);F.tgt=.08+Math.random()*.84}F.fv+=((F.tgt??.5)-F.fy)*(2+f.df*3)*dt;F.fv*=Math.pow(.2,dt);F.fy=clamp(F.fy+F.fv*dt*(1+f.df*.6),.04,.96);
    const inz=Math.abs(F.fy-F.zy)<F.zs/2;F.p=clamp(F.p+(inz?.32:-.24-f.df*.04)*dt,0,1);if(inz&&Math.random()<dt*8)splash(F.bx,F.by,1);
    if(F.p>=1)catchFish();else if(F.p<=0)endFish('A linha soltou-se. Perdeste o peixe.','#c8c0b0')}}

function houseClick(m,v){

  else if(m==='hpull'){S.store=S.store||[];const i=S.store.findIndex(x=>String(x.uid)===v);if(i<0||S.inv.length>=30)return;S.inv.push(S.store.splice(i,1)[0]);S.newLoot=true;save();drawHouse()}

function subProc(sb){const t=nearest(260),base=basePow(1),c=sb.col;
  const heal=f=>{const v=Math.round(PS.maxHp*f);P.hp=Math.min(PS.maxHp,P.hp+v);float(P.x,P.y-44,'+'+v,'#8fd16a');spark(P.x,P.y-14,'#8fd16a',16,90,{up:-60})};
  switch(sb.pr){
    case 'nova':aoe(P.x,P.y-10,115,base*(sb.m||2),{col:c,kb:0});ring(P.x,P.y-6,120,c,.45,6);spark(P.x,P.y-10,c,30,220);G.shake=Math.max(G.shake,7);sfx('boom');break;
    case 'shield':P.shield=Math.max(P.shield||0,Math.round(PS.maxHp*.15));P.shieldT=Math.max(P.shieldT||0,6);ring(P.x,P.y-12,50,c,.4,4);sfx('chime');break;
    case 'heal':heal(.06);ring(P.x,P.y-12,46,c,.4,3);break;
    case 'stun':aoe(P.x,P.y-10,120,base*.8,{stun:1.4,col:c});ring(P.x,P.y-6,125,c,.45,6);G.shake=Math.max(G.shake,8);sfx('roar');break;
    default:if(!t)return;
      if(sb.pr==='fire'){aoe(t.x,t.y-t.r*.5,72,base*1.8,{burn:3,col:c});ring(t.x,t.y,80,c,.4,5);spark(t.x,t.y-10,c,30,200);decal(t.x,t.y,40,'rgba(25,10,4,.5)',5);sfx('boom')}
      else if(sb.pr==='freeze'){aoe(t.x,t.y-t.r*.5,95,base*.6,{stun:1.5,freeze:1,col:c});ring(t.x,t.y,100,c,.5,5);spark(t.x,t.y-10,c,26,160)}
      else if(sb.pr==='pierce'){const a=Math.atan2(t.y-t.r-(P.y-10),t.x-P.x);lineHit(P.x,P.y-10,a,440,28,base*2.5,{col:c});beams.push({x:P.x,y:P.y-10,ang:a,len:440,w:12,col:c,t:.25,max:.25});sfx('fire')}
      else if(sb.pr==='rain')areas.push({x:t.x,y:t.y,r:72,t:1.6,acc:0,dmg:base*.55});
      else if(sb.pr==='judg'){pillars.push({x:t.x,y:t.y,t:.6,max:.6});aoe(t.x,t.y-t.r*.5,64,base*2,{col:c});heal(.05);sfx('chime')}
      else if(sb.pr==='bones'){aoe(t.x,t.y-t.r*.5,85,base*1.6,{col:'#e8dcb0'});for(let i=0;i<10;i++)spark(t.x,t.y-10,'#e8dcb0',2,200,{ang:i*.628,spread:.2,add:false,s:4});ring(t.x,t.y,90,c,.4,4)}
      else if(sb.pr==='drain'){dealDmg(t,base*1.5,{col:c});heal(.08);bolts.push({pts:[{x:P.x,y:P.y-16},{x:t.x,y:t.y-t.r}],t:.3,max:.3,col:c})}
      else if(sb.pr==='crit3'){dealDmg(t,base*3,{crit:1,col:c});ring(t.x,t.y-t.r,40,c,.3,4);G.hs=Math.max(G.hs,.08)}
      else if(sb.pr==='poison'){aoe(t.x,t.y-t.r*.5,85,base*.5,{burn:5,col:c});decal(t.x,t.y,60,'rgba(80,160,40,.35)',4);spark(t.x,t.y-6,c,24,70,{up:-40})}
      else if(sb.pr==='chain'){const L=[t].concat(targets().filter(e=>e!==t&&Math.hypot(e.x-t.x,e.y-t.y)<260).sort((a,b)=>Math.hypot(a.x-t.x,a.y-t.y)-Math.hypot(b.x-t.x,b.y-t.y)).slice(0,4));const pts=[{x:P.x,y:P.y-20}];for(const e of L){pts.push({x:e.x,y:e.y-e.r});dealDmg(e,base*1.2,{col:c,chain:1})}bolts.push({pts,t:.3,max:.3,col:c});sfx('crit')}
      else if(sb.pr==='roots'){aoe(t.x,t.y-t.r*.5,100,base*.6,{slow:[2.5,.2],stun:1.2,col:c});ring(t.x,t.y,105,c,.5,4);spark(t.x,t.y,'#6a4a2a',20,90,{add:false})}}
  float(P.x,P.y-60,sb.pn,c)}

cv.addEventListener('pointerdown',e=>{e.preventDefault();if(G.mode==='map'){if(mapTap(e))return;setMode('play');return}if(G.mode!=='play')return;
  const[x,y]=local(e);if(x<VW*.5&&joy.id===null){joy.id=e.pointerId;joy.ox=x;joy.oy=y;joy.x=joy.y=0;try{cv.setPointerCapture(e.pointerId)}catch(_){}}else if(x>=VW*.5)G.buf.attack=.25});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;const[x,y]=local(e);let dx=x-joy.ox,dy=y-joy.oy;const m=Math.hypot(dx,dy);if(m>52){joy.ox+=dx-dx/m*52;joy.oy+=dy-dy/m*52;dx=dx/m*52;dy=dy/m*52}joy.x=dx/52;joy.y=dy/52});
const endJoy=e=>{if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0}};cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
const press=(el,fn,up)=>{el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();el.classList.add('on');fn()});const rel=()=>{el.classList.remove('on');up&&up()};['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,rel))};
press($('#bA'),()=>{held.attack=true;G.buf.attack=.25},()=>held.attack=false);press($('#bD'),()=>G.buf.dodge=.25);press(bH,()=>G.buf.heal=.25);press(bE,interact);skB.forEach((b,i)=>press(b,()=>castSkill(i)));press($('#bQ'),useCons);press($('#bM'),toggleMount);
mapBtn.addEventListener('click',()=>{if(G.mode==='play')setMode('map');else if(G.mode==='map')setMode('play')});
bag.addEventListener('click',()=>{if(G.mode==='play')openBag('play')});
{const cvx=$('#cv');cvx.addEventListener('pointerdown',()=>{if(G.fish){if(G.fish.st==='reel')G.fhold=true;else if(G.fish.st==='bite')G.buf.attack=.25}});addEventListener('pointerup',()=>{G.fhold=false});addEventListener('pointercancel',()=>{G.fhold=false})}
$('#optBtn').addEventListener('click',()=>{if(G.mode==='play'){sfx('click');setMode('menu');drawOpts()}});
$('#dBtn').addEventListener('click',()=>{if(G.mode==='play'){sfx('click');openDiary()}});
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;keys[e.code]=true;if(G.mode==='map'&&(e.code==='KeyM'||e.code==='Escape')){setMode('play');return}if(G.mode!=='play')return;
  if(e.code==='Escape'){setMode('menu');drawOpts()}else if(e.code==='KeyJ')G.buf.attack=.25;else if(e.code==='Space'||e.code==='KeyK'){G.buf.dodge=.25;e.preventDefault()}else if(e.code==='KeyH')G.buf.heal=.25;else if(e.code==='KeyE')interact();else if(e.code==='KeyM')setMode('map');else if(e.code==='KeyI')openBag('play');else if(e.code==='KeyL')openDiary();else if(e.code==='KeyR')toggleMount();
  else if(e.code==='KeyQ')useCons();else if(e.code==='Digit1')castSkill(0);else if(e.code==='Digit2')castSkill(1);else if(e.code==='Digit3')castSkill(2)});
addEventListener('keyup',e=>{keys[e.code]=false});addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode!=='title'&&G.mode!=='create')save()});

/* ---------- ciclo ---------- */
let last=performance.now(),uiF=-1,uiC='',uiBag=null,uiSk=['','',''],uiQ='';
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;G.rt+=dt;
  if(G.hs>0){G.hs-=dt;dt*=.12}else if(G.slow>0){G.slow-=dt;dt*=.3}
  if(G.mode==='play'){if(CUT)cutTick(dt);else update(dt)}else{G.time+=dt;if(G.mode==='title'||G.mode==='create'){ambient(dt,40*T+Math.sin(G.rt*.06)*560,58*T,0);stepParts(dt)}}
  render();
  if(G.mode==='play'){
    if(P.flasks!==uiF){uiF=P.flasks;bH.querySelector('b').textContent=P.flasks}
    const c=G.ctx&&!P.fly?(G.ctx.k==='chama'?(S.brasas>=cost()?'Descansar · Subir nível':'Descansar'):G.ctx.k==='npc'?'Falar':G.ctx.k==='stairs'?(inDungeon()?'Subir':'Descer'):G.ctx.k==='board'?'Ver caçadas':G.ctx.k==='fish'?'Pescar':G.ctx.k==='portal'?'Arena':G.ctx.k==='pass'?'Picos Gelados':G.ctx.k==='pass2'?'Voltar':G.ctx.k==='aexit'?'Sair':EVL[G.ctx.k]?EVL[G.ctx.k]():'Abrir baú'):'';if(c!==uiC){uiC=c;bE.hidden=!c;bE.textContent=c;bE.classList.toggle('glow',c.includes('Subir'))}
    {const qk=quickKey(),qv=qk+(S.cons[qk]||0);if(qv!==uiQ){uiQ=qv;updQ()}}
    if(uiBag!==S.newLoot){uiBag=S.newLoot;bag.innerHTML='Mochila'+(S.newLoot?'<i></i>':'')}
    CLS[S.cls].skills.forEach((id,i)=>{const sk=SK[id],cdMax=sk.cd*(1-PS.cdr)*(1-.1*(S.skl[i]||0)),f=P.cd[i]/cdMax,key=Math.round(f*40)+'|'+(P.mp<sk.mp)+'|'+Math.ceil(P.cd[i]);
      if(key!==uiSk[i]){uiSk[i]=key;const b=skB[i];b.querySelector('.cd').style.setProperty('--p',f*100);b.querySelector('.sec').textContent=P.cd[i]>0?Math.ceil(P.cd[i]):'';b.classList.toggle('low',P.mp<sk.mp)}})}
  requestAnimationFrame(frame)}
buildGround(36,OH);buildObjSprites();recalc();placeAt(0);titleScreen();requestAnimationFrame(frame);setTimeout(gbIdle,300);tbChk();
})();
</script>
